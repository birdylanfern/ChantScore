name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - name: Unit tests (GABC round-trip, Latin syllabification, storage)
        run: npm test
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
